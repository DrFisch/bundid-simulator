<!DOCTYPE html>
<!-- Neu 2026 im Fork bpsim/standardkonform (siehe FORK.md): Nachrichtenliste des Postfachs (Karten, Punkt für
     ungelesen; „Zurück zum Dienst“ nur in der Kopfzeile). Seit 2026-10-18 im gemeinsamen Stil (leeres Postfach als
     Kasten mit Erklärung). -->
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head data-th-replace="~{postfach/rahmen :: head('Postfach')}"></head>
<body>
<nav data-th-replace="~{postfach/rahmen :: nav}"></nav>
<main class="container bpsim-seite" style="max-width: 900px;">
    <div class="d-flex flex-wrap justify-content-between align-items-baseline gap-2 mb-3">
        <h1 class="h3 mb-0">Nachrichten</h1>
        <span class="text-muted small" data-th-if="${!#lists.isEmpty(eintraege)}"
              data-th-text="${#lists.size(eintraege)} + ' Nachricht(en), davon ' + ${ungelesen} + ' ungelesen'">0</span>
    </div>

    <div class="bpsim-block text-center py-4" data-th-if="${#lists.isEmpty(eintraege)}">
        <svg class="mb-2" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11Z"
                  fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="m3.5 6.5 8.5 6 8.5-6" fill="none" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <p class="fw-semibold mb-1">Ihr Postfach ist leer.</p>
        <p class="text-muted small mb-0">Bestätigungen zu Terminen und Anträgen erscheinen hier, sobald ein Dienst sie an
            Ihr Postkorb-Handle schickt.</p>
    </div>

    <div class="list-group bpsim-karten" data-th-unless="${#lists.isEmpty(eintraege)}">
        <a class="list-group-item list-group-item-action py-3 shadow-sm" data-th-each="e : ${eintraege}"
           data-th-classappend="${e.unread} ? 'eintrag-neu'"
           data-th-href="@{__${basepath}__/postfach/nachricht/{id}(id=${e.id})}">
            <div class="d-flex flex-wrap justify-content-between gap-2">
                <span data-th-classappend="${e.unread} ? 'fw-bold'">
                    <span class="badge rounded-pill bg-primary bpsim-punkt me-1" data-th-if="${e.unread}"><span class="visually-hidden">neu</span></span>
                    <span data-th-text="${e.title}">Titel</span>
                </span>
                <small class="text-muted" data-th-text="${e.received} + ' Uhr'">Datum</small>
            </div>
            <small class="text-muted" data-th-text="${e.sender} + ' · ' + ${e.service}">Absender</small>
            <div class="small mt-1" data-th-if="${e.requiresHigherLevel}">
                <span class="badge bg-secondary" data-th-text="'Vertrauensniveau „' + ${e.levelName} + '“ nötig'">Niveau</span>
            </div>
        </a>
    </div>

</main>
<footer data-th-replace="~{postfach/rahmen :: footer}"></footer>
</body>
</html>
