<!DOCTYPE html>
<!-- Geändert 2026 im Fork bpsim/standardkonform (siehe FORK.md): Zeichensatz und viewport im gemeinsamen Kopf,
     Seitentitel als Parameter; eigenes Erscheinungsbild (2026-10-18): Kopfzeile mit Zeichen, Titel und Umgebung als
     Kennzeichnung der Simulation, helle Fußzeile mit Version und Hinweis „Simulation“. -->
<html lang="de">
<head data-th-fragment="head(titel)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-th-text="${titel} + ' – ' + ${@environment.getProperty('app.web.title')}">Title</title>
    <link rel="stylesheet" type="text/css" data-th-href="@{__${basepath}__/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" data-th-href="@{__${basepath}__/css/layout.css}">
    <!-- ohne defer: setzt die Klasse bpsim-js vor dem ersten Zeichnen, der Rest wartet auf DOMContentLoaded -->
    <script src="" data-th-src="@{__${basepath}__/js/auswahl.js}"></script>
</head>
<body>
<!-- ************************************************************************************** -->
<nav class="navbar bpsim-kopf mb-3 mb-md-4" data-th-fragment="navbar">
    <div class="container column-gap-2 row-gap-1">
        <span class="bpsim-marke">
            <svg class="bpsim-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 2 4 5v6c0 5.2 3.4 9.5 8 11 4.6-1.5 8-5.8 8-11V5l-8-3Z" fill="currentColor" opacity=".3"/>
                <path d="m8.3 12.1 2.5 2.5 4.9-5" fill="none" stroke="currentColor" stroke-width="2.2"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="text-truncate" data-th-text="${@environment.getProperty('app.web.title')}">BundID-Simulator</span>
        </span>
        <span class="ms-auto bpsim-umgebung text-truncate">Umgebung: <strong
                data-th-text="${@environment.getProperty('app.env')}">xxx</strong></span>
    </div>
</nav>
<!-- ************************************************************************************** -->
<footer class="bpsim-fuss mt-4 py-3" data-th-fragment="footer">
    <script src="" data-th-src="@{__${basepath}__/webjars/bootstrap/js/bootstrap.min.js}"></script>
    <div class="container small">
        <span class="fw-semibold" data-th-text="${@environment.getProperty('spring.application.name')}">bundid-simulator</span>
        <span class="ms-1" data-th-text="${@environment.getProperty('spring.application.version')}">0.0</span>
        <span class="d-block mt-1">Simulation der BundID für Test und Lehre – keine echte BundID. Alle Personen sind
            fiktiv; bitte keine echten Daten eingeben.</span>
    </div>
</footer>
</body>
</html>
