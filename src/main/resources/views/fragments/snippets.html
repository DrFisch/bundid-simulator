<!DOCTYPE html>
<!-- Geändert 2026 im Fork bpsim/standardkonform (siehe FORK.md): Zeichensatz und viewport im gemeinsamen Kopf,
     Kopfzeile auf dem Handy kompakt. -->
<html lang="de">
<head data-th-fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-th-text="${@environment.getProperty('app.web.title')}">Title</title>
    <link rel="stylesheet" type="text/css" data-th-href="@{__${basepath}__/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" data-th-href="@{__${basepath}__/css/layout.css}">
</head>
<body>
<!-- ************************************************************************************** -->
<nav class="navbar navbar-dark mb-4" data-th-fragment="navbar">
    <div class="container flex-wrap gap-1">
        <span class="h1 mb-0 bpsim-titel" data-th-text="${@environment.getProperty('app.web.title')}"></span>
        <span class="ms-auto small">Umgebung: <strong
                data-th-text="${@environment.getProperty('app.env')}">xxx</strong></span>
    </div>
</nav>
<!-- ************************************************************************************** -->
<footer class="mt-3 py-3" data-th-fragment="footer">
    <script src="" data-th-src="@{__${basepath}__/webjars/bootstrap/js/bootstrap.min.js}"></script>
    <div class="container">
        <span class="h4" data-th-text="${@environment.getProperty('spring.application.name')}">bundid-simulator</span>
        <span class="ms-3" style="color:#D9D3C7;"
              data-th-text="${@environment.getProperty('spring.application.version')}">0.0</span>
    </div>
</footer>
</body>
</html>
