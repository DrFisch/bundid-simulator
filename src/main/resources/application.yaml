debug: false
trace: false

logging:
  pattern:
    console: "%d{HH:mm:ss} [%thread] [%-5level] %class{36}.%M | %msg%n"
  level:
    de.ba: debug
    root: info

spring:
  application:
    name: "bundid-simulator"
    version: "latest"
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  jackson:
    mapper:
      accept-case-insensitive-properties: true
  thymeleaf:
    prefix: "classpath:views/"
    cache: false
    suffix: .html
  web:
    resources:
      cache:
        period: 0
      static-locations: "classpath:static"

app:
  basepath:
  env: "localDEV"
  web:
    title: "BundID-Simulator"
  resources:
    userdefinition: "classpath:users.yml"
  # Fork bpsim/standardkonform (siehe FORK.md). Alle Voreinstellungen = Originalverhalten.
  # Per Umgebungsvariable setzbar (Punkte → "_", Bindestriche entfallen), z. B. APP_SAML_IDPENTITYID,
  # APP_SAML_SSOURL, APP_SAML_LOAFORMAT, APP_SAML_POSTKORBHANDLE_ENABLED, APP_SAML_SIGNING_ENABLED.
  saml:
    idp-entity-id: ""          # z. B. "https://bundid.example.de/saml/metadata"; leer = Issuer ist die SP-EntityID
    sso-url: ""                # öffentliche URL von POST /saml (für die Metadaten)
    loa-format: "stork"        # "stork" = STORK-QAA-Level-n, "eidas" = http://eidas.europa.eu/LoA/...
    postkorb-handle:
      enabled: false           # true = Attribut PostkorbHandle (urn:oid:2.5.4.18) liefern
    signing:
      enabled: false           # true = Assertion signieren (RSA-SHA256)
      keystore: ""             # PKCS12-Datei mit Schlüssel und Zertifikat
      password: ""
      alias: "idp-signing"
  sso:
    enabled: false             # true = Anmeldesitzung (Single Sign-on), Umgebungsvariable APP_SSO_ENABLED
  # Postfach der simulierten BundID (Fork): Nachrichten an das Postkorb-Handle, Anzeige nach Anmeldung (braucht
  # app.sso.enabled=true). Umgebungsvariablen APP_POSTFACH_ENABLED, APP_POSTFACH_APIKEY, APP_POSTFACH_STORAGEDIR,
  # APP_POSTFACH_PORTALURL, APP_POSTFACH_PORTALNAME.
  postfach:
    enabled: false             # true = /postfach (Oberfläche) und POST /api/v1/messages (Einlieferung)
    api-key: ""                # Schlüssel der einliefernden Dienste (Header X-Api-Key); leer = Einlieferung gesperrt
    storage-dir: "/app/data/postfach"
    portal-url: ""             # optional: Link „Zurück zu …“ im Postfach, z. B. https://portal.example.de/
    portal-name: ""            # Name dazu, z. B. "BürgerPortal"

# Fork: Sitzungscookie des simulierten IdP (nur für die Anmeldesitzung genutzt). Nur Cookie, keine Sitzungs-ID in URLs.
# Hinter einem TLS-Proxy zusätzlich SERVER_SERVLET_SESSION_COOKIE_SECURE=true setzen.
server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: BUNDIDSIM_SSO
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  health:
    defaults:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
